; PlatformIO Project Configuration File — AeroGarden Connect
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-super-mini]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
extra_scripts = pre:scripts/build_web.py

monitor_speed = 115200

; Upload filesystem image alongside firmware
board_build.filesystem = littlefs

; C3 uses USB-Serial/JTAG — set the correct upload port
board_build.mcu = esp32c3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/DHT sensor library @ ^1.4.7
    adafruit/Adafruit Unified Sensor
    milesburton/DallasTemperature @ ^4.0.6
    paulstoffregen/OneWire @ 2.3.8
    https://github.com/mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/Adafruit NeoPixel @ ^1.12.0

; Partition scheme with room for LittleFS
board_build.partitions = min_spiffs.csv
